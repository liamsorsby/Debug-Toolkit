version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # v10 needs conventional-changelog-writer 9, which semantic-release's
      # release-notes-generator (still on writer 8) can't load; this breaks releases.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix"
      include: scope
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # v10 needs conventional-changelog-writer 9, which semantic-release's
      # release-notes-generator (still on writer 8) can't load; this breaks releases.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix"
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
