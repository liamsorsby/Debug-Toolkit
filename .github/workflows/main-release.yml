name: Main release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  commit-policy:
    name: Conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint pushed squash commit
        run: git log -1 --pretty=%B | npx commitlint

  quality:
    name: Release validation
    needs: commit-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run release quality and profile gates
        run: >
          ./gradlew
          qualityCheck
          jacocoTestReport
          assembleRelease
          :baselineprofile:assemble
          :benchmark:assemble
          --stacktrace
          --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: main-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
            baselineprofile/build/reports/
            benchmark/build/reports/
          if-no-files-found: warn

  release:
    name: Firebase and Google Play release
    needs: [quality]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci --ignore-scripts
      - name: Materialize release credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
      - name: Validate release credentials
        run: |
          jq empty app/google-services.json || {
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON secret is not valid JSON. Copy the raw contents of google-services.json (unescaped, no surrounding quotes) into the secret."
            exit 1
          }
          jq empty "$RUNNER_TEMP/firebase-service-account.json" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not valid JSON. Copy the raw contents of the service account key file into the secret."
            exit 1
          }
          jq empty "$RUNNER_TEMP/play-service-account.json" || {
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not valid JSON. Copy the raw contents of the Play service account key file into the secret."
            exit 1
          }
      - name: Calculate Play version code
        env:
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: echo "VERSION_CODE=$((${VERSION_CODE_OFFSET:-0} + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          PLAY_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/play-service-account.json
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx semantic-release
