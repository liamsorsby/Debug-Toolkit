name: Main release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  commit-policy:
    name: Conventional commit
    # Releases only ever come from main, even when the workflow is started from another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint pushed squash commit
        run: git log -1 --pretty=%B | npx commitlint

  quality:
    name: Release validation
    needs: commit-policy
    runs-on: ubuntu-latest
    env:
      APP_UPDATE_POLICY_URL: ${{ vars.APP_UPDATE_POLICY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run release quality and profile gates
        run: >
          ./gradlew
          qualityCheck
          jacocoTestReport
          assembleRelease
          :baselineprofile:assemble
          :benchmark:assemble
          --stacktrace
          --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: main-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
            baselineprofile/build/reports/
            benchmark/build/reports/
          if-no-files-found: warn

  release:
    name: Firebase and Google Play release
    needs: [quality]
    runs-on: ubuntu-latest
    environment: production-release
    env:
      APP_UPDATE_POLICY_URL: ${{ vars.APP_UPDATE_POLICY_URL }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci --ignore-scripts
      - name: Materialize release credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
      - name: Validate release credentials
        run: |
          jq -e 'type == "object" and has("project_info")' app/google-services.json >/dev/null || {
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON secret is missing or not valid google-services.json content. Copy the raw contents of google-services.json (unescaped, no surrounding quotes) into the secret."
            exit 1
          }
          jq -e 'type == "object" and has("private_key")' "$RUNNER_TEMP/firebase-service-account.json" >/dev/null || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is missing or not valid service account JSON. Copy the raw contents of the service account key file into the secret."
            exit 1
          }
          jq -e 'type == "object" and has("private_key")' "$RUNNER_TEMP/play-service-account.json" >/dev/null || {
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing or not valid service account JSON. Copy the raw contents of the Play service account key file into the secret."
            exit 1
          }
          [[ -s "$RUNNER_TEMP/upload.keystore" ]] || {
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty. Set it to the base64-encoded contents of the upload keystore."
            exit 1
          }
      - name: Calculate Play version code
        env:
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: echo "VERSION_CODE=$((${VERSION_CODE_OFFSET:-0} + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          PLAY_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/play-service-account.json
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEW_RELIC_RELEASE_TOKEN: ${{ secrets.NEW_RELIC_RELEASE_TOKEN }}
        run: npx semantic-release
