name = "debugtoolkit-privacy-policy"
main = "worker.js"
compatibility_date = "2026-09-24"

rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

[vars]
SKIP_DEPENDENCY_INSTALL = "true"
MIN_SUPPORTED_VERSION_CODE = "0"
PLAY_UPDATE_URL = "https://play.google.com/store/apps/details?id=co.sorsby.debugtoolkit"
OTHER_UPDATE_URL = "https://play.google.com/store/apps/details?id=co.sorsby.debugtoolkit"

[previews.vars]
SKIP_DEPENDENCY_INSTALL = "true"
MIN_SUPPORTED_VERSION_CODE = "0"
PLAY_UPDATE_URL = "https://play.google.com/store/apps/details?id=co.sorsby.debugtoolkit"
OTHER_UPDATE_URL = "https://play.google.com/store/apps/details?id=co.sorsby.debugtoolkit"
