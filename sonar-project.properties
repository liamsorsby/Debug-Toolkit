sonar.projectName=Debug Toolkit
sonar.sourceEncoding=UTF-8
sonar.sources=app/src/main/java
sonar.tests=app/src/test,app/src/androidTest
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
sonar.exclusions=**/BuildConfig.*,**/R.class,**/R$*.class,**/*Preview*,**/*Theme.kt,**/*Color.kt,**/*Type.kt
sonar.coverage.exclusions=**/ui/**,**/*UiState*,**/*SettingsRepository*,**/*NetworkMonitor*,**/*Application*,**/*Activity*
